name: Release - Build Native Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            profile: package-windows
            artifact-name: HeThongDauGiaClient-Windows
          - os: macos-latest
            profile: package-mac
            artifact-name: HeThongDauGiaClient-macOS
          - os: ubuntu-latest
            profile: package-linux
            artifact-name: HeThongDauGiaClient-Linux

    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.os }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and package with jpackage
        run: mvn -B clean package -P${{ matrix.profile }} -DskipTests

      - name: List dist output
        shell: bash
        run: ls -la target/dist/

      - name: Upload app-image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: target/dist/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create GitHub Release

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: HeThongDauGiaClient-Windows
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: HeThongDauGiaClient-macOS
          path: artifacts/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: HeThongDauGiaClient-Linux
          path: artifacts/linux

      - name: Create ZIP archives
        run: |
          cd artifacts/windows
          zip -r ../../HeThongDauGiaClient-Windows.zip HeThongDauGiaClient
          cd ../macos
          zip -r ../../HeThongDauGiaClient-macOS.zip HeThongDauGiaClient.app
          cd ../linux
          mv *.deb ../../

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Hệ Thống Đấu Giá - Client - ${{ github.ref_name }}

            ### Tải về (Downloads)
            - **Windows**: `HeThongDauGiaClient-Windows.zip` (Giải nén và chạy file `HeThongDauGiaClient/HeThongDauGiaClient.exe`)
            - **macOS**: `HeThongDauGiaClient-macOS.zip` (Giải nén và chạy ứng dụng `HeThongDauGiaClient.app`)
            - **Linux**: File cài đặt `.deb` (Cài đặt bằng cách click đúp hoặc chạy `sudo dpkg -i *.deb`)

            ### Hướng dẫn sử dụng
            1. **Windows/macOS**: Tải file ZIP tương ứng, giải nén và chạy file thực thi để khởi động.
            2. **Linux**: Cài đặt gói `.deb`, ứng dụng sẽ tự động được thêm vào menu hệ thống để bạn có thể tìm kiếm và mở trực tiếp.

            > **Lưu ý**: Ứng dụng đã được đóng gói kèm theo Java Runtime Environment (JRE) tương thích, nên người dùng không cần cài đặt sẵn Java trên máy.
          files: |
            HeThongDauGiaClient-Windows.zip
            HeThongDauGiaClient-macOS.zip
            *.deb
          draft: false
          prerelease: false
