name: Release - Build Native Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            profile: package-windows
            artifact-name: HeThongDauGia-Windows
          - os: macos-latest
            profile: package-mac
            artifact-name: HeThongDauGia-macOS

    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.os }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and package with jpackage
        run: mvn -B clean package -P${{ matrix.profile }} -DskipTests

      - name: List dist output
        shell: bash
        run: ls -la target/dist/

      - name: Upload app-image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: target/dist/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create GitHub Release

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: HeThongDauGia-Windows
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: HeThongDauGia-macOS
          path: artifacts/macos

      - name: Create ZIP archives
        run: |
          cd artifacts/windows
          zip -r ../../HeThongDauGia-Windows.zip .
          cd ../macos
          zip -r ../../HeThongDauGia-macOS.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## He Thong Dau Gia - ${{ github.ref_name }}

            ### Downloads
            - **Windows**: `HeThongDauGia-Windows.zip` - Giai nen va chay file `.exe`
            - **macOS**: `HeThongDauGia-macOS.zip` - Giai nen va chay file `.app`

            ### Huong dan su dung
            1. Tai file ZIP tuong ung voi he dieu hanh
            2. Giai nen vao thu muc bat ky
            3. Chay `HeThongDauGiaServer` truoc, sau do chay `HeThongDauGiaClient`

            > **Luu y**: Ung dung da bao gom JRE, khong can cai dat Java.
          files: |
            HeThongDauGia-Windows.zip
            HeThongDauGia-macOS.zip
          draft: false
          prerelease: false
