name: Java CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Install xvfb (Linux only)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Build and Verify with Maven (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run mvn -B verify --file pom.xml

    - name: Build and Verify with Maven (non-Linux)
      if: runner.os != 'Linux'
      run: mvn -B verify --file pom.xml
